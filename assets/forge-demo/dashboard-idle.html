<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="5">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge Coordinate — Dashboard</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --white: #f7f5f0; --off-white: #efece5; --light-green: #e8f0e8;
  --border: #ccc8be; --border-light: #ddd9d0;
  --text: #2c2c28; --text-secondary: #5c5c54; --text-dim: #8c8c82;
  --green: #16a34a; --green-bg: #e8f0e8;
  --amber: #b8860b; --amber-bg: #fdf8e8;
  --red: #c03030; --red-bg: #faf0f0;
  --grey: #8c8c82;
  --font-ui: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  --shadow-sm: 0 1px 3px rgba(60,55,45,0.10);
}
@media (prefers-color-scheme: dark) {
  :root {
    /* "Forge at Night" — iron base, ember-copper accents, glow not fill.
       Variable names mirror the light-theme :root above so all selectors
       flow through unchanged. WCAG AA verified by hex luminance: --text on
       --off-white ~14.5:1, --text-dim ~4.6:1, accent colors all ≥6:1. */
    --white: #161d24; --off-white: #0e1419; --light-green: #172821;
    --border: #2a3340; --border-light: #1f2731;
    --text: #e6e8eb; --text-secondary: #a8b0bc; --text-dim: #7a8290;
    --green: #5eb88a; --green-bg: #16291f;
    --amber: #e89770; --amber-bg: #2a1d12;
    --red: #e88078; --red-bg: #3a1818;
    --grey: #7a8290;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.45);
  }
  /* Targeted overrides — the variable redefinitions above carry the bulk
     of the theming; these few selectors had glow shapes baked at light-base
     luminance that read as flat fills on the dark base. Lift the spread so
     the embers feel incandescent rather than stickered.
     The :root prefix is load-bearing: same-selector rules appear LATER
     in this file at specificity (0,2,0)/(0,3,0). @media blocks do not
     bump specificity, so without the :root prefix these overrides would
     be shadowed by source order. The prefix raises specificity to
     (0,3,0)/(0,4,0) so the dark cascade actually wins. */
  :root .forge-pulse .ember { box-shadow: 0 0 6px var(--green); }
  :root .forge-pulse.working-green .ember { box-shadow: 0 0 10px var(--green); }
  :root .forge-pulse.working-amber .ember { box-shadow: 0 0 9px var(--amber); }
  :root .forge-pulse.working-red .ember { box-shadow: 0 0 6px var(--red); }
}
html { font-size: 15px; }
body { font-family: var(--font-ui); line-height: 1.5; background: var(--off-white); color: var(--text); min-height: 100vh; }
.dashboard { max-width: 1400px; margin: 0 auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
.top-bar { background: var(--white); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-sm); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; position: relative; }
.top-bar::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--green-bg), var(--green), var(--green-bg)); opacity: 0.5; border-radius: 10px 10px 0 0; }
.top-bar-left, .top-bar-right { display: flex; align-items: center; gap: 12px; }
.logo { font-size: 14px; font-weight: 700; color: var(--text); }
.logo span { color: var(--green); }
.logo-divider { color: var(--border); margin: 0 2px; font-weight: 300; }
.logo-sub { font-size: 13px; font-weight: 500; color: var(--text-secondary); }
.phase-tag { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--green); background: var(--green-bg); padding: 3px 10px; border-radius: 6px; }
.declaration-pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 10px; background: var(--green-bg); color: var(--green); display: inline-flex; align-items: center; gap: 6px; }
.declaration-pill .decl-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); font-weight: 700; }
.declaration-pill .decl-story-id { font-family: var(--font-mono); font-weight: 700; }
.declaration-pill .decl-phase { font-family: var(--font-mono); color: var(--text-secondary); font-weight: 500; }
/* ── Forge Pulse — three-hex respiration cluster + ember ────────────────── */
.forge-pulse { display: inline-flex; align-items: center; gap: 10px; padding: 4px 10px; border-radius: 8px; background: var(--off-white); border: 1px solid var(--border-light); }
.forge-pulse .pulse-cluster { position: relative; display: inline-flex; align-items: center; gap: 2px; width: 44px; height: 20px; }
.forge-pulse .hex { display: inline-block; width: 12px; height: 12px; clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%); background: var(--green); transform-origin: center; }
.forge-pulse .ember { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 4px var(--green); transform: translate(-50%, -50%); }
.forge-pulse .pulse-caption { font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--text-dim); letter-spacing: 0.04em; }

/* Idle — cold silhouette with a slow tri-axis respiration so operators can
   tell the dashboard is still updating. v0.39.2 AC-3/B11 introduced an
   opacity-only breath; v0.39.4 upgrades it to vary scale (0.78↔0.92, an 18%
   diameter swing), opacity (0.40↔0.78), and a faint ambient halo in lockstep
   over a 4.8s cycle, because at 12px hex size the prior opacity-only
   modulation was below the perceptual floor and read as static. Base shape
   stays scale(0.85)/opacity(0.55) to match the prefers-reduced-motion fallback
   below — the keyframe modulates around that base in both directions.
   Halo uses filter:drop-shadow, not box-shadow, because the .hex base rule
   (above) carries a hexagonal clip-path that would clip a box-shadow
   invisibly inside the polygon. filter:drop-shadow respects clip-path and
   paints a halo that follows the hex silhouette. Caught in PR #494
   stateless review. */
.forge-pulse.idle { background: var(--border-light); border-color: var(--border); }
.forge-pulse.idle .hex { background: var(--grey); opacity: 0.55; transform: scale(0.85); animation: forge-respire-idle 4.8s ease-in-out infinite; }
.forge-pulse.idle .hex-1 { animation-delay: 0s; }
.forge-pulse.idle .hex-2 { animation-delay: 0.3s; }
.forge-pulse.idle .hex-3 { animation-delay: 0.6s; }
.forge-pulse.idle .pulse-caption { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }

/* Working-green — smooth respiration wave + steady ember pulse. */
.forge-pulse.working-green .hex { background: var(--green); animation: forge-respire 2.4s ease-in-out infinite; }
.forge-pulse.working-green .hex-1 { animation-delay: 0s; }
.forge-pulse.working-green .hex-2 { animation-delay: 0.2s; }
.forge-pulse.working-green .hex-3 { animation-delay: 0.4s; }
.forge-pulse.working-green .ember { background: var(--green); box-shadow: 0 0 6px var(--green); animation: forge-ember-green 1.2s ease-in-out infinite; }

/* Working-amber — labored stutter + amber ember. */
.forge-pulse.working-amber { border-color: var(--amber); background: var(--amber-bg); }
.forge-pulse.working-amber .hex { background: var(--amber); animation: forge-respire-stutter 3.2s ease-in-out infinite; }
.forge-pulse.working-amber .hex-1 { animation-delay: 0s; }
.forge-pulse.working-amber .hex-2 { animation-delay: 0.4s; }
.forge-pulse.working-amber .hex-3 { animation-delay: 0.8s; }
.forge-pulse.working-amber .ember { background: var(--amber); box-shadow: 0 0 5px var(--amber); animation: forge-ember-amber 1.8s ease-in-out infinite; }
.forge-pulse.working-amber .pulse-caption { color: var(--amber); }

/* Working-red — frozen mid-cycle + dying ember. */
.forge-pulse.working-red { border-color: var(--red); background: var(--red-bg); }
.forge-pulse.working-red .hex { background: var(--red); transform: scale(0.92); opacity: 0.75; }
.forge-pulse.working-red .ember { background: var(--red); box-shadow: 0 0 3px var(--red); animation: forge-ember-dying 3s ease-in-out infinite; }
.forge-pulse.working-red .pulse-caption { color: var(--red); }

@keyframes forge-respire { 0%, 100% { transform: scale(0.88); opacity: 0.7; } 50% { transform: scale(1.08); opacity: 1; } }
@keyframes forge-respire-idle { 0%, 100% { transform: scale(0.78); opacity: 0.4; background-color: #3a3a3a; filter: drop-shadow(0 0 0 rgba(138, 138, 138, 0)); } 50% { transform: scale(0.92); opacity: 0.78; background-color: #c8c8c8; filter: drop-shadow(0 0 4px rgba(138, 138, 138, 0.55)); } }
@keyframes forge-respire-stutter { 0%, 18%, 100% { transform: scale(0.9); opacity: 0.7; } 32% { transform: scale(1.04); opacity: 0.95; } 38% { transform: scale(0.96); opacity: 0.85; } 60% { transform: scale(1.06); opacity: 1; } }
@keyframes forge-ember-green { 0%, 100% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.85; } 50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } }
@keyframes forge-ember-amber { 0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.7; } 40% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 60% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.85; } }
@keyframes forge-ember-dying { 0%, 100% { transform: translate(-50%, -50%) scale(0.7); opacity: 0.35; } 50% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.6; } }

@media (prefers-reduced-motion: reduce) {
  .forge-pulse .hex,
  .forge-pulse .ember { animation: none !important; }
  .forge-pulse.working-green .hex,
  .forge-pulse.working-amber .hex,
  .forge-pulse.working-red .hex { transform: scale(1); opacity: 1; }
  .forge-pulse.idle .hex { transform: scale(0.85); opacity: 0.55; }
}
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat-card { background: var(--white); border: 1px solid var(--border-light); border-radius: 10px; padding: 12px 16px; box-shadow: var(--shadow-sm); }
.stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); font-weight: 600; }
.stat-value { font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: var(--text); margin: 4px 0; }
.stat-value-sm { font-size: 13px; color: var(--text-secondary); }
.stat-sub { font-size: 12px; color: var(--text-dim); font-style: italic; }
.stat-bar { height: 6px; background: var(--border-light); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.stat-bar-fill { height: 100%; background: var(--green); transition: width 0.6s ease; }
.stat-bar-fill.approaching { background: var(--amber); }
.stat-bar-fill.exceeded { background: var(--red); }
.replanning-notes { display: flex; flex-direction: column; gap: 6px; }
.replanning-note { padding: 8px 14px; border-radius: 8px; border: 1px solid; font-size: 13px; display: flex; gap: 10px; align-items: center; }
.replanning-note.blocking { background: var(--red-bg); border-color: var(--red); color: var(--red); }
.replanning-note.should-address { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }
.replanning-note.informational { background: var(--off-white); border-color: var(--border-light); color: var(--text-secondary); }
.severity-tag { font-family: var(--font-mono); font-weight: 700; font-size: 11px; }
.kanban-board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.kanban-column { background: var(--white); border: 1px solid var(--border-light); border-radius: 10px; padding: 12px; box-shadow: var(--shadow-sm); min-height: 160px; position: relative; }
.kanban-column::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 10px 10px 0 0; background: var(--grey); }
.kanban-column.accent-neutral::before { background: var(--border); }
.kanban-column.accent-amber::before { background: var(--amber); }
.kanban-column.accent-green::before { background: var(--green); }
.kanban-column.accent-red::before { background: var(--red); }
.column-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); font-weight: 700; padding-bottom: 8px; border-bottom: 1px solid var(--border-light); margin-bottom: 8px; }
.column-body { display: flex; flex-direction: column; gap: 8px; }
.story-card { background: var(--off-white); border: 1px solid var(--border-light); border-radius: 8px; padding: 10px; font-size: 12px; }
.story-card.active { background: var(--amber-bg); border: 1.5px solid var(--amber); }
.story-card .card-id { font-family: var(--font-mono); font-weight: 600; color: var(--green); font-size: 13px; }
.story-card .card-tool { color: var(--text-secondary); font-weight: 600; margin-top: 4px; }
.story-card .card-stage { color: var(--text); font-size: 12px; margin-top: 2px; }
.story-card .card-label { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
.story-card .card-evidence { color: var(--text-dim); font-size: 11px; margin-top: 6px; font-style: italic; }
.story-card .card-live { color: var(--amber); font-size: 11px; margin-top: 6px; }
/* v0.38.0 I1+I2 grounding observability — chips + per-path indicators. */
.story-card .card-warnings { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.story-card .card-warning-chip { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; font-family: var(--font-mono); }
.story-card .card-warning-chip.warning { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber); }
.story-card .master-merged-badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: var(--green-bg); color: var(--green); border: 1px solid var(--green); margin-top: 4px; }
.story-card .card-non-fatal-warnings { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.story-card .card-non-fatal-warning { font-size: 11px; color: var(--amber); font-style: italic; }
.story-card .card-paths { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.story-card .card-path { font-size: 11px; font-family: var(--font-mono); color: var(--text-secondary); display: inline-block; }
.story-card .card-path.path-ok .path-indicator { color: var(--green); font-weight: 700; }
.story-card .card-path.path-missing .path-indicator { color: var(--red); font-weight: 700; }
.stat-card .drift-line { font-size: 11px; color: var(--amber); margin-top: 4px; font-weight: 600; }
.retry-badge { display: inline-block; font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--amber); background: var(--amber-bg); padding: 2px 6px; border-radius: 4px; margin-top: 4px; }
.empty-state { display: flex; justify-content: center; align-items: center; padding: 20px 0; }
.empty-hex { width: 32px; height: 32px; background: var(--border-light); clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%); }
.hex-dot { display: inline-block; width: 10px; height: 10px; background: var(--green); clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%); vertical-align: middle; margin-right: 4px; }
.hex-dot.amber { background: var(--amber); animation: hex-pulse 2s ease-in-out infinite; }
@keyframes hex-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.85); opacity: 0.5; } }
.activity-feed { background: var(--white); border: 1px solid var(--border-light); border-radius: 10px; padding: 12px 16px; max-height: 220px; overflow-y: auto; box-shadow: var(--shadow-sm); font-size: 12px; }
.activity-feed.empty { color: var(--text-dim); font-style: italic; }
.feed-entry { display: grid; grid-template-columns: 80px 140px 1fr auto 90px; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--border-light); align-items: center; }
.feed-entry:last-child { border-bottom: none; }
.feed-time { font-family: var(--font-mono); color: var(--text-dim); font-size: 11px; }
.feed-tool { font-family: var(--font-mono); color: var(--green); font-weight: 600; }
.feed-stage { color: var(--text); }
.feed-decision { color: var(--text-secondary); font-style: italic; }
.feed-role { font-family: var(--font-mono); color: var(--text-dim); font-size: 11px; text-align: right; }

/* ── Narrow / mobile (phones, vertical screens) ─────────────────────────────
   The 6-column board is a wide, short artifact; on a tall narrow screen it
   either crops sideways or floats as a short island, and six columns across a
   ~360pt phone forces card text below the legibility floor. So at <=640px we
   switch metaphor from BOARD to a vertical "grouped-by-status list": the six
   statuses stack full-width in workflow order (Backlog->Ready->In Progress->
   Retry->Done->Blocked, the markup order), each a section header + its cards.
   This is the conventional responsive kanban pattern (Linear/Asana/Notion/
   GitHub all offer a list-grouped-by-status sibling of the board) and it is
   what LETS fonts step up to the mobile legibility floor (body >=16px). Empty
   (zero-card) statuses collapse to a one-line header so the board stays
   scannable instead of endlessly tall. Desktop layout is untouched. */
@media (max-width: 640px) {
  html { font-size: 16px; }
  .dashboard { padding: 14px 16px; gap: 12px; }
  .top-bar { flex-wrap: wrap; padding: 14px 16px; gap: 12px; }

  /* stats: 4-up is illegible on a phone — go 2-up and enlarge */
  .stats-row { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat-value { font-size: 26px; }
  .stat-value-sm { font-size: 16px; }
  .stat-label { font-size: 13px; }
  .stat-sub { font-size: 14px; }

  /* board -> single-column stacked status sections */
  .kanban-board { grid-template-columns: 1fr; gap: 10px; }
  .kanban-column { min-height: 0; padding: 14px 16px; }
  .column-header { font-size: 15px; padding-bottom: 10px; margin-bottom: 10px; }

  /* legibility floor for card text (>=14px labels, >=16px body) */
  .story-card { font-size: 16px; padding: 14px; }
  .story-card .card-id { font-size: 17px; }
  .story-card .card-tool { font-size: 15px; }
  .story-card .card-stage { font-size: 15px; }
  .story-card .card-label,
  .story-card .card-evidence,
  .story-card .card-live,
  .story-card .card-path,
  .story-card .card-non-fatal-warning { font-size: 14px; }
  .story-card .card-warning-chip,
  .story-card .master-merged-badge { font-size: 12px; }
  .retry-badge { font-size: 14px; }

  /* collapse EMPTY status sections to a compact one-liner (kill dead space) */
  .kanban-column.is-empty { min-height: 0; padding: 12px 16px; opacity: 0.7; }
  .kanban-column.is-empty .column-header { padding-bottom: 0; margin-bottom: 0; border-bottom: none; }
  .kanban-column.is-empty .column-body { display: none; }

  /* activity feed: drop the redundant trailing columns, enlarge the rest */
  .activity-feed { font-size: 14px; max-height: none; }
  .feed-entry { grid-template-columns: auto auto 1fr; gap: 10px; }
  .feed-decision,
  .feed-role { display: none; }
  .feed-time { font-size: 13px; }
}
</style>
</head>
<body>
<div class="dashboard">

<div class="top-bar">
  <div class="top-bar-left">
    <div class="logo"><span>forge</span>-harness<span class="logo-divider">/</span><span class="logo-sub">Coordinate</span></div>
    <div class="phase-tag">in-progress</div>
    
  </div>
  <div class="top-bar-right">
    <div class="forge-pulse idle" role="status" aria-label="Forge idle — no tool running">
    <div class="pulse-cluster" aria-hidden="true">
      <span class="hex hex-1"></span>
      <span class="hex hex-2"></span>
      <span class="hex hex-3"></span>
      
    </div>
    <span class="pulse-caption">idle</span>
  </div>
  </div>
</div>
<div class="stats-row">
  <div class="stat-card"><div class="stat-label">Stories</div><div class="stat-value">2/5</div><div class="stat-bar"><div class="stat-bar-fill green" style="width: 40%"></div></div></div>
  <div class="stat-card"><div class="stat-label">Budget</div><div class="stat-value">$0.80</div><div class="stat-sub">no limit</div></div>
  <div class="stat-card"><div class="stat-label">Time</div><div class="stat-value">0m 00s</div><div class="stat-sub">no limit</div></div>
  <div class="stat-card"><div class="stat-label">Recommendation</div><div class="stat-value-sm">-</div></div>
</div>

<div class="kanban-board">
  <div class="kanban-column accent-grey" id="col-backlog">
  <div class="column-header"><span class="col-title">Backlog</span><span class="col-count">1</span></div>
  <div class="column-body"><div class="story-card pending" data-story-id="DEMO-4" data-master-merged="false"><div class="card-id">DEMO-4</div></div></div>
</div>
  <div class="kanban-column accent-neutral" id="col-ready">
  <div class="column-header"><span class="col-title">Ready</span><span class="col-count">1</span></div>
  <div class="column-body"><div class="story-card ready" data-story-id="DEMO-3" data-master-merged="false"><div class="card-id">DEMO-3</div></div></div>
</div>
  <div class="kanban-column accent-amber is-empty" id="col-in-progress">
  <div class="column-header"><span class="col-title">In Progress</span><span class="col-count">0</span></div>
  <div class="column-body"><div class="empty-state"><div class="empty-hex"></div></div></div>
</div>
  <div class="kanban-column accent-amber" id="col-retry">
  <div class="column-header"><span class="col-title">Retry</span><span class="col-count">1</span></div>
  <div class="column-body"><div class="story-card ready-for-retry" data-story-id="DEMO-2" data-master-merged="false"><div class="card-id">DEMO-2</div><span class="retry-badge">1/3 retries</span><div class="card-evidence">AC failed: sum.test.js — 1 prior attempt, retrying</div></div></div>
</div>
  <div class="kanban-column accent-green" id="col-done">
  <div class="column-header"><span class="col-title">Done</span><span class="col-count">2</span></div>
  <div class="column-body"><div class="story-card done" data-story-id="DEMO-1" data-master-merged="false"><div class="card-id">DEMO-1</div><div class="card-evidence">passed</div></div><div class="story-card done" data-story-id="DEMO-5" data-master-merged="false"><div class="card-id">DEMO-5</div><div class="card-evidence">passed</div></div></div>

<script>
// Localize feed timestamps. Server emits UTC for CI/test determinism; the
// browser converts to the viewer's TZ on every meta-refresh load. Original
// UTC ISO is kept as the element's title attribute so hovering reveals it.
(function () {
  function pad(n) { return String(n).padStart(2, "0"); }
  var nodes = document.querySelectorAll("[data-iso]");
  for (var i = 0; i < nodes.length; i++) {
    var el = nodes[i];
    var iso = el.getAttribute("data-iso");
    if (!iso) continue;
    var d = new Date(iso);
    if (isNaN(d.getTime())) continue;
    el.textContent =
      d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
      " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    el.title = "UTC: " + iso;
  }
})();
</script>
